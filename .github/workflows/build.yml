name: Build Secure Tor Browser (Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Builder Repository
      uses: actions/checkout@v4
      
    - name: Setup Build Environment
      run: |
        Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.0.2.exe" -OutFile "MozillaBuildSetup.exe"
        Start-Process -FilePath ".\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
        
    - name: Download Mozilla Gecko Source
      run: |
        git clone --depth 1 https://github.com/mozilla/gecko-dev.git mozilla-central
        
    - name: Create mozconfig
      run: |
        Set-Content -Path "mozilla-central\.mozconfig" -Value @"
        ac_add_options --enable-application=browser
        ac_add_options --disable-crashreporter
        ac_add_options --disable-updater
        ac_add_options --disable-tests
        ac_add_options --enable-optimize
        ac_add_options --enable-release
        ac_add_options --disable-lto
        "@
        
    - name: Build Secure Browser
      run: |
        $Path = $env:GITHUB_WORKSPACE.Replace('\', '/') + '/mozilla-central'
        C:\mozilla-build\start-shell.bat -c "cd `"$Path`" && ./mach bootstrap --application-choice=browser && ./mach build"
        
    - name: Inject Secure AutoConfig
      run: |
        $distPath = Get-ChildItem -Path mozilla-central -Directory -Filter "obj-*" | Select-Object -First 1 | Join-Path -ChildPath "dist\bin"
        $prefPath = Join-Path $distPath "defaults\pref"
        if (-not (Test-Path $prefPath)) { New-Item -ItemType Directory -Path $prefPath }
        
        Set-Content -Path (Join-Path $prefPath "local-settings.js") -Value @"
        pref("general.config.filename", "mozilla.cfg");
        pref("general.config.obscure_value", 0);
        "@
        
        Set-Content -Path (Join-Path $distPath "mozilla.cfg") -Value @"
        // IMPORTANT: Start with a comment line
        lockPref("network.proxy.type", 1);
        lockPref("network.proxy.socks", "127.0.0.1");
        lockPref("network.proxy.socks_port", 9150);
        lockPref("network.proxy.socks_remote_dns", true);
        lockPref("privacy.resistFingerprinting", true);
        lockPref("javascript.options.wasm", false);
        lockPref("dom.webaudio.enabled", false);
        lockPref("dom.battery.enabled", false);
        "@
        
    - name: Upload Browser Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firefox-secure-build-windows
        path: mozilla-central/obj-*/dist/bin/
