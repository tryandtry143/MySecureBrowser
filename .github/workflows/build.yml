name: Build Secure Tor Browser (Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Builder Repository
      uses: actions/checkout@v4
      
    - name: Setup Build Environment
      run: |
        Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.0.2.exe" -OutFile "MozillaBuildSetup.exe"
        Start-Process -FilePath ".\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait
        
    - name: Download Mozilla Gecko Source
      run: |
        git clone --depth 1 https://github.com/mozilla/gecko-dev.git mozilla-central
        
    - name: Apply Security Patches
      run: |
        cd mozilla-central
        Set-Content -Path "patch.py" -Value @"
        import os
        path = 'netwerk/base/nsProtocolProxyService.cpp'
        with open(path, 'r', encoding='utf-8') as f:
            content = f.read()
        target = 'nsProtocolProxyService::Resolve_Internal(nsIChannel* channel,'
        idx = content.find(target)
        if idx != -1:
            brace_idx = content.find('{', idx)
            if brace_idx != -1:
                insert_code = '''
          // TOR ENFORCEMENT: Hardcoded SOCKS5 proxy to localhost:9150
          nsCOMPtr<nsIProxyInfo> torProxy;
          nsresult rv = NewProxyInfo("socks"_ns, "127.0.0.1"_ns, 9150,
                                     nsIProxyInfo::TRANSPARENT_PROXY_RESOLVES_HOST,
                                     UINT32_MAX, nullptr, getter_AddRefs(torProxy));
          if (NS_SUCCEEDED(rv)) {
            torProxy.forget(result);
            return NS_OK;
          }
        '''
                content = content[:brace_idx+1] + '\n' + insert_code + content[brace_idx+1:]
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(content)
        
        prefs_path = 'browser/app/profile/firefox.js'
        with open(prefs_path, 'a', encoding='utf-8') as f:
            f.write('\npref("privacy.resistFingerprinting", true);\n')
            f.write('pref("javascript.options.wasm", false);\n')
            f.write('pref("dom.webaudio.enabled", false);\n')
            f.write('pref("dom.battery.enabled", false);\n')
        "@
        python patch.py
        
    - name: Create mozconfig
      run: |
        Set-Content -Path "mozilla-central\.mozconfig" -Value @"
        ac_add_options --enable-application=browser
        ac_add_options --disable-crashreporter
        ac_add_options --disable-updater
        ac_add_options --disable-tests
        ac_add_options --enable-optimize
        ac_add_options --enable-release
        ac_add_options --disable-lto
        ac_add_options --disable-elf-hack
        "@
        
    - name: Build Secure Browser
      run: |
        $Path = $env:GITHUB_WORKSPACE.Replace('\', '/') + '/mozilla-central'
        C:\mozilla-build\start-shell.bat -c "cd `"$Path`" && ./mach bootstrap --application-choice=browser --no-interactive && ./mach build"
        
    - name: Upload Browser Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firefox-secure-build-windows
        path: mozilla-central/obj-*/dist/firefox/
